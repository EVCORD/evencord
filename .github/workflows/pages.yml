name: Deploy EvenCord Pages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: evencord-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'EVCORD/evencord' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate static site inputs
        run: |
          test -f website/index.html
          test -f website/assets/plugins.json
          test -z "$(find website -type l -print -quit)"
      - name: Package static Pages artifact
        run: tar --directory website -cf "$RUNNER_TEMP/artifact.tar" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - name: Publish reviewed site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
